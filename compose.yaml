# ============================================================
# SmartDesk 完整编排（Day12）
#
# 用法：
#   docker compose up -d              启动全部（mysql + redis + app）
#   docker compose up -d mysql redis  只启动依赖（本地跑 jar 时用这个）
#   docker compose logs -f app        看应用日志
#   docker compose down               停止
#   docker compose down -v            停止并删除数据卷（数据没了！）
#
# 关键设计：depends_on + condition: service_healthy
#   让 app 等 mysql 和 redis【真正就绪】后再启动，
#   而不是"容器启动了"就认为依赖可用。
#   这是 compose 编排里最常见的启动顺序问题。
# ============================================================
services:
  mysql:
    image: mysql:8.0
    container_name: smartdesk-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-smartdesk_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smartdesk}
      TZ: Asia/Shanghai
    ports:
      # 宿主机 3307 -> 容器 3306。
      # 用 3307 是为了不占用本机已有的 MySQL 3306。
      - "${MYSQL_PORT:-3307}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动执行建表脚本
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-smartdesk_root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: smartdesk-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    # --appendonly yes 开启 AOF 持久化，容器重启数据不丢
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-smartdesk_root}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-smartdesk_root}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartdesk-app
    restart: unless-stopped
    # 等依赖真正健康后再启动
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 容器之间用服务名互相访问，不走 localhost
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smartdesk}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-smartdesk_root}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-smartdesk_root}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-key-must-be-changed-in-production-0123456789}
      SERVER_PORT: 18080
      SPRING_PROFILES_ACTIVE: prod
      # Week3：模型 Provider。默认 mock，离线即可跑通全部接口；
      # 要用真实模型就传 AI_PROVIDER=openai + OPENAI_API_KEY。
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "${APP_PORT:-18080}:18080"

volumes:
  mysql-data:
  redis-data:

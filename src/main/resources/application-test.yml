# ============================================================
# 测试环境（Spring Profile: test）
#
# 激活方式：
#   mvn test
#   （测试类用 @ActiveProfiles("test")）
#
# 特点：
#   - 日志收敛到 WARN，避免刷屏
#   - 关闭 SQL 打印
#   - 健康检查不暴露详情
# ============================================================
spring:
  config:
    activate:
      on-profile: test

  # Week5：测试库 schema 自动重建。
  # 为什么自动化：以前建表要手工执行 schema-test.sql，一旦忘了加新表，
  # 测试就会因为"表不存在"而失败，而失败原因离真正的问题（业务逻辑）很远。
  # 现在每次测试上下文启动都重建一次，测试与建表脚本永远同步。
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-test.sql
      continue-on-error: false
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:smartdesk_test}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:smartdesk_root}

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:smartdesk_root}
      # 测试环境用独立的 db 编号，测试数据不污染开发数据
      database: 1

mybatis-plus:
  configuration:
    # 测试时关掉 SQL 打印，否则日志会被淹没
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    root: WARN
    com.smartdesk: INFO

# Week3：测试全部走 mock Provider，不依赖任何真实模型、不需要 API Key。
# 重试退避压到 1ms，避免测试因为"等 300ms 再重试"而变慢。
smartdesk:
  ai:
    provider: mock
    max-attempts: 3
    retry-base-millis: 1
    mock-chunk-delay-millis: 0
    mock:
      latency-millis: 0
    # Week4：把 Agent 的刹车调紧，用少量请求就能验证保护措施生效
    agent:
      max-rounds: 3
      max-tool-calls-per-round: 3
      duplicate-call-threshold: 2
      total-timeout: 10s
  # Week5：RAG 全部走 mock embedding（离线确定性），测试不依赖任何真实服务
  rag:
    chunk-size: 400
    chunk-overlap: 80
    top-k: 5
    similarity-threshold: 0.05
    embedding:
      provider: mock
      dimensions: 256

management:
  endpoint:
    health:
      show-details: never

# ============================================================
# SmartDesk 基础配置（所有环境共享）
#
# Day12 要点：敏感信息一律走环境变量，不写死在仓库里。
# 写法：${VAR:default} —— 有环境变量用环境变量，没有用默认值。
# 这样同一份配置文件，本地、测试、生产都能用。
# ============================================================
spring:
  application:
    name: smartdesk

  # ---------------- 数据库 ----------------
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:smartdesk}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ---------------- Redis ----------------
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:smartdesk_root}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:3s}
      lettuce:
        pool:
          # 连接池参数：Redis 连接是 IO 密集型，
          # 池子太小会在高并发时排队，太大则浪费连接
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3s

  # ---------------- Jackson / JSON ----------------
  # Spring Boot 4 默认使用 Jackson 3（包名 tools.jackson）。
  # 两个 Boot 4 变化：
  # 1) WRITE_DATES_AS_TIMESTAMPS 从 SerializationFeature 移到了
  #    DateTimeFeature，配置路径随之从 spring.jackson.serialization.*
  #    改为 spring.jackson.datatype.datetime.*。写错路径启动会直接失败：
  #    "No enum constant tools.jackson.databind.SerializationFeature.xxx"
  # 2) Jackson 3 默认按属性名字母序序列化。测试里比较 JSON 原始字符串时，
  #    要么改用 jsonPath 断言，要么显式关掉：
  #    spring.jackson.mapper.sort-properties-alphabetically: false
  jackson:
    datatype:
      datetime:
        # 日期输出成 ISO-8601 字符串而不是时间戳数字
        write-dates-as-timestamps: false
    time-zone: Asia/Shanghai

  # ---------------- 数据初始化 ----------------
  sql:
    init:
      # schema.sql 由 src/main/resources/db/schema.sql 提供
      mode: never

# ---------------- MyBatis-Plus ----------------
mybatis-plus:
  # 开启驼峰命名自动映射：owner_id -> ownerId
  configuration:
    map-underscore-to-camel-case: true
    # 开发阶段打印 SQL 和参数，定位问题非常有用
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.stdout.StdOutImpl}
  global-config:
    banner: false
    db-config:
      # 主键策略：数据库自增
      id-type: auto
      # 逻辑删除：删除时把 deleted 置 1，而不是真的 DELETE
      # 面试可讲：为什么知识库场景更适合逻辑删除（可追溯、可恢复）
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---------------- 服务端口 ----------------
# 注意：不要写死 8080。本机 8080 可能被占用，
# 用环境变量 SERVER_PORT 覆盖，改动零成本。
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

# ---------------- Actuator ----------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ---------------- JWT（Day11）----------------
smartdesk:
  jwt:
    # 生产环境必须通过 JWT_SECRET 环境变量注入。
    # 这里给一个开发默认值，长度必须 >= 32 字节（HS256 要求）。
    # 部署时用：export JWT_SECRET="$(openssl rand -base64 48)"
    secret: ${JWT_SECRET:dev-only-secret-key-must-be-changed-in-production-0123456789}
    expiration-seconds: ${JWT_EXPIRATION:7200}

  # ---------------- Spring AI（Week3 / Day15-21）----------------
  # 【关键设计】provider 可切换，业务代码只依赖 Spring AI 的 ChatClient 接口。
  #   mock   —— 离线、确定性、可故障注入，本地开发与全部自动化测试默认用它
  #   openai —— 任何 OpenAI 兼容协议的服务（OpenAI / DeepSeek / 通义千问兼容模式 /
  #              Moonshot / 本地 vLLM / Ollama 的 /v1 端点），只改 base-url 和 model
  # 真实模型不可用时也能完成调用链路与错误处理的验收，
  # 但正式投递前必须用真实 Key 跑一遍核心流程（Day19 的验收项）。
  ai:
    provider: ${AI_PROVIDER:mock}
    model: ${AI_MODEL:gpt-4o-mini}
    # 温度：结构化输出场景要稳定，所以默认偏低
    temperature: ${AI_TEMPERATURE:0.3}
    # 单次请求超时。超过就抛 AI_TIMEOUT，由重试策略决定是否再来一次
    request-timeout: ${AI_REQUEST_TIMEOUT:20s}
    # 最多尝试次数（含第一次），不是"重试次数"
    max-attempts: ${AI_MAX_ATTEMPTS:3}
    # 指数退避基数：第 n 次重试等待 base * 2^(n-1) + 随机抖动
    retry-base-millis: ${AI_RETRY_BASE_MILLIS:300}
    # 结构化输出被模型写坏时，最多再补问几次（把校验错误回喂给模型）
    max-repair-attempts: ${AI_MAX_REPAIR_ATTEMPTS:1}
    # mock Provider 每个流式分片之间的间隔，演示 SSE 时肉眼可见
    mock-chunk-delay-millis: ${AI_MOCK_CHUNK_DELAY:60}
    openai:
      base-url: ${AI_BASE_URL:https://api.openai.com/v1}
      # 没有默认值：没配 Key 就不该静默失败，AiConfig 会在启动时明确报错
      api-key: ${OPENAI_API_KEY:}
      # 有些兼容服务不支持 response_format，置 false 时只用 Prompt 约束输出 JSON
      supports-json-mode: ${AI_JSON_MODE:false}
    mock:
      # 模拟真实网络耗时，用来观察 P99；测试环境设为 0 保证速度
      latency-millis: ${AI_MOCK_LATENCY:80}
    # ---------------- Agent 工具调用治理（第 4 周）----------------
    # 这一组全是"刹车"：没有它们，模型可能反复调工具把 token 烧光
    agent:
      # 模型 ↔ 工具最大往返轮数。常见链路"查列表→查详情→创建"是 3 轮，留 1 轮余量
      max-rounds: ${AI_MAX_ROUNDS:4}
      # 单轮最多执行几个工具（模型有时一次返回十几个并行调用）
      max-tool-calls-per-round: ${AI_MAX_TOOL_CALLS:5}
      # 整个 Agent 循环的总预算。4 轮 × 20s 单次超时 = 80s，用户早走了
      total-timeout: ${AI_TOOL_TIMEOUT:60s}
      # 待确认草稿存活时间，过期后确认接口返回 404
      confirmation-ttl: ${AI_CONFIRM_TTL:5m}
      # 回灌给模型的历史消息条数上限
      max-history-messages: ${AI_MAX_HISTORY:20}
      # 同一工具 + 同一参数连续出现多少次判定为死循环
      duplicate-call-threshold: ${AI_DUPLICATE_THRESHOLD:3}

  # ---------------- RAG 知识库（第 5 周 / Day29-35）----------------
  # 切片参数【必须可配置】：不同文档类型需要不同策略，
  # 而且要用评测集量化对比（hit@k / 引用正确率），不能拍脑袋写死。
  rag:
    enabled: ${RAG_ENABLED:true}
    # 切片长度（字符）。中文制度类文档 300~500 字符通常是一个自然段
    chunk-size: ${RAG_CHUNK_SIZE:400}
    # 相邻切片重叠字符数：防止答案正好落在切割线上被劈成两半
    chunk-overlap: ${RAG_CHUNK_OVERLAP:80}
    # 过短的尾巴片段并入上一片，避免产生一句话碎片
    min-chunk-size: ${RAG_MIN_CHUNK_SIZE:40}
    # 默认召回片段数（Top-K）
    top-k: ${RAG_TOP_K:5}
    # 调用方能传入的 Top-K 上限，防止有人传 10000 拖垮数据库
    max-top-k: ${RAG_MAX_TOP_K:20}
    # 相似度阈值：低于这个分数不返回。宁可说"没查到"，也不给模型喂噪音
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.05}
    # 单文档最大字符数
    max-document-chars: ${RAG_MAX_DOC_CHARS:100000}
    # 单份文档最多参与检索的片段数，防止一份超长文档霸榜
    max-chunks-per-document: ${RAG_MAX_CHUNKS_PER_DOC:50}
    embedding:
      # mock —— 离线确定性哈希嵌入，无需 Key，测试与 CI 全用它
      # openai —— 任何兼容 /v1/embeddings 的服务（百炼 text-embedding-v3 / OpenAI）
      #           注意：DeepSeek 没有 embedding 接口，用它的 Key 时这里保持 mock
      provider: ${RAG_EMBEDDING_PROVIDER:mock}
      model: ${RAG_EMBEDDING_MODEL:text-embedding-v3}
      dimensions: ${RAG_EMBEDDING_DIMENSIONS:256}

# ---------------- 日志 ----------------
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.smartdesk: ${LOG_LEVEL_APP:DEBUG}
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

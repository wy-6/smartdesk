# ============================================================
# Docker 构建与编排验证（Day12 的"云端实测"）
#
# 为什么需要这个工作流：
#   本机是 Windows 11 家庭版 + WSL 被安全策略封禁，Docker Desktop
#   起不来（见 docs/docker-setup.md）。Dockerfile / compose.yaml 一直
#   处于"写好了但没跑过"的状态 —— 这个工作流让 GitHub 的 Linux
#   runner 帮我们把"构建 → 编排 → 健康检查 → 冒烟测试"完整跑一遍。
#
# 触发：手动（workflow_dispatch）或改动 Dockerfile / compose.yaml /
#       src / pom.xml 时自动触发。
#
# 面试价值：CI 里验证容器化交付物，是"工程化能力"的直接证据。
# ============================================================
name: docker-verify

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "compose.yaml"
      - ".dockerignore"
      - "src/**"
      - "pom.xml"
      - ".github/workflows/docker-verify.yml"

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # ---- 第一段：跑测试（镜像外的质量门） ----
      # 容器化之前先确认代码本身是绿的，不然容器只是把坏代码打包了。
      # 排除需要真实数据库的测试：TaskIntegrationTest / AiIntegrationTest /
      # AgentIntegrationTest / KnowledgeIntegrationTest 都要连本地 3307 的 dev MySQL，
      # CI 里没这个依赖（compose 的 MySQL 还没起），留给下面的冒烟测试覆盖。
      #
      # RagEvaluationTest 同样要连 MySQL（它要真的写入向量再检索），
      # 但名字不是 IntegrationTest 后缀，所以必须显式排除 ——
      # 否则 CI 会在"compose 还没起"的阶段直接跑挂。
      - name: 单元测试与切片测试
        run: mvn -B test -Dtest='!*IntegrationTest,!RagEvaluationTest' -DfailIfNoTests=false
        env:
          JWT_SECRET: ci-only-secret-key-for-testing-must-be-32-bytes

      # ---- 第二段：构建镜像（验证 Dockerfile 本身） ----
      - name: 构建应用镜像
        run: docker build -t smartdesk:ci .

      # ---- 第三段：compose 编排 + 健康检查等待 ----
      # 验证点：
      #   1. compose.yaml 语法与变量插值是否正确
      #   2. depends_on: service_healthy 是否真的等到依赖就绪
      #   3. 镜像内应用能否用 prod profile 正常启动
      #      （LOG_FILE / curl / 非 root 用户这三处都跑通了才算过）
      - name: 启动完整编排
        run: docker compose up -d --wait
        env:
          JWT_SECRET: ci-only-secret-key-for-testing-must-be-32-bytes

      - name: 冒烟测试：健康检查 + 注册 + 登录 + 越权
        working-directory: .
        run: |
          set -e
          BASE=http://localhost:18080

          echo "--- 1. 健康检查（HEALTHCHECK 依赖的同一个端点） ---"
          curl -fsS "$BASE/api/health" | tee /dev/stderr | grep -q '"success":true'

          echo "--- 2. 未登录访问任务接口 → 401 ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/tasks")
          [ "$code" = "401" ] || { echo "期望 401，实际 $code"; exit 1; }

          echo "--- 3. 注册 → 201 ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$BASE/api/auth/register" \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci_smoke","password":"Passw0rd2026"}')
          [ "$code" = "201" ] || { echo "期望 201，实际 $code"; exit 1; }

          echo "--- 4. 登录拿 token ---"
          TOKEN=$(curl -fsS -X POST "$BASE/api/auth/login" \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci_smoke","password":"Passw0rd2026"}' \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["data"]["token"])')
          [ -n "$TOKEN" ] || { echo "登录失败：没拿到 token"; exit 1; }

          echo "--- 5. 带 token 创建任务 ---"
          TASK_ID=$(curl -fsS -X POST "$BASE/api/tasks" \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $TOKEN" \
            -d '{"title":"CI 冒烟","priority":3,"dueDate":"2026-12-31T18:00:00"}' \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["data"]["id"])')
          [ -n "$TASK_ID" ] || { echo "创建任务失败"; exit 1; }

          echo "--- 6. 查询自己的任务 → 200 ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/tasks/$TASK_ID" \
            -H "Authorization: Bearer $TOKEN")
          [ "$code" = "200" ] || { echo "期望 200，实际 $code"; exit 1; }

          echo "=== 冒烟测试全部通过 ==="

      # ---- 第四段：无论成败都留下容器日志，失败时排查用 ----
      - name: 导出容器日志（排查用）
        if: always()
        run: |
          docker compose logs --no-color > compose-logs.txt || true
          echo "===== app 容器日志尾部 ====="
          docker compose logs --no-color --tail 50 app || true

      - name: 上传日志 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs.txt
          retention-days: 7

      # ---- 第五段：验证优雅停机（ENTRYPOINT 里 exec 的价值） ----
      # docker stop 默认 10 秒宽限；exec 后 JVM 是 PID 1，
      # SIGTERM 直达，应该秒退而不是被 SIGKILL 强杀。
      - name: 优雅停机验证
        run: |
          START=$(date +%s)
          docker compose stop app
          END=$(date +%s)
          ELAPSED=$((END - START))
          echo "app 容器停机耗时 ${ELAPSED}s（<10s 说明收到了 SIGTERM 正常退出）"
          [ "$ELAPSED" -lt 10 ] || { echo "停机超过 10 秒，JVM 可能被 SIGKILL 强杀"; exit 1; }

      - name: 清理
        if: always()
        run: docker compose down -v --remove-orphans || true
